<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Rápida de Balcão - A5 Tecnologia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body class="bg-[#F8FAFC] dark:bg-[#05070B] text-slate-900 dark:text-slate-100 min-h-screen antialiased transition-colors">
    <header class="bg-[#0B3B60] dark:bg-[#081221] border-b border-white/10 text-white px-6 py-4 shadow-md flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <span class="bg-sky-500 text-slate-950 font-black px-3 py-1 rounded-xl text-base">A5</span>
            <div>
                <h1 class="text-lg font-black">🔎 CONSULTA RÁPIDA DE O.S. (BALCÃO / VENDAS)</h1>
                <p class="text-xs text-sky-200">Modo somente leitura • Localização física e status em tempo real</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="toggleConsultaTheme()" id="consultaThemeBtn"
                    class="text-xs font-bold bg-white/10 hover:bg-white/20 border border-white/15 px-3 py-2 rounded-xl transition">
                🌙 Dark
            </button>
            <a href="/admin" class="text-xs font-bold bg-white/10 hover:bg-white/20 border border-white/15 px-3.5 py-2 rounded-xl transition">Voltar ao Admin</a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-6">
        <div class="bg-white dark:bg-[#0B0F17] p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 mb-6">
            <input type="text" id="qInput" oninput="renderList()" autofocus
                placeholder="Digite o Nº da O.S., Nome do Cliente, Modelo da Balança ou Lacre..."
                class="w-full px-4 py-3 text-base bg-transparent border border-slate-300 dark:border-slate-700 rounded-xl focus:outline-none focus:border-sky-600">
        </div>

        <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </main>

    <script>
        const socket = io();
        let allCards = [];

        // [S-01] Escape seguro contra quebra de HTML / XSS
        function esc(str) {
            return String(str ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        async function loadData() {
            const res = await fetch("/api/board");
            const data = await res.json();
            allCards = [];
            data.lists.forEach(l => {
                l.cards.forEach(c => {
                    c.stage_name = l.title;
                    allCards.push(c);
                });
            });
            renderList();
        }
        loadData();
        socket.on("board_updated", loadData);

        function renderList() {
            const q = document.getElementById("qInput").value.trim().toLowerCase();
            const container = document.getElementById("resultsGrid");

            const filtered = allCards.filter(c => {
                const str = `${c.os_number} ${c.client_name} ${c.equipment_type} ${c.equipment_model} ${c.shelf_location} ${c.inmetro_seal}`.toLowerCase();
                return str.includes(q);
            });

            // [L-14] & [L-16] overflow-hidden rounded-2xl, break-words e paleta focal Azul & Branco / Azul & Preto
            container.innerHTML = filtered.map(c => {
                const photos = [...(c.entry_photos || []), ...(c.quote_photos || []), ...(c.label_before_photos || []), ...(c.label_after_photos || []), ...(c.exit_photos || [])];
                return `
                    <div class="bg-white dark:bg-[#0B0F17] rounded-2xl p-4 shadow-sm border border-slate-200 dark:border-slate-800 flex flex-col justify-between overflow-hidden">
                        <div>
                            <div class="flex flex-wrap justify-between items-center gap-2 mb-2">
                                <span class="bg-[#0B3B60] dark:bg-sky-600 text-white font-black px-3 py-1 rounded-xl text-sm">O.S. ${esc(c.os_number)}</span>
                                <span class="bg-sky-50 dark:bg-sky-950/60 text-sky-800 dark:text-sky-300 border border-sky-200 dark:border-sky-800 font-bold text-xs px-2.5 py-1 rounded-full truncate max-w-[200px]">${esc(c.stage_name)}</span>
                            </div>
                            <h3 class="font-black text-base uppercase break-words text-slate-900 dark:text-white">${esc(c.client_name)}</h3>
                            <p class="text-xs text-slate-500 dark:text-slate-400 mb-2.5 break-words">${esc(c.equipment_type)} ${esc(c.equipment_model || '')}</p>
                            <div class="text-xs space-y-1 bg-slate-50 dark:bg-[#05070B] p-3 rounded-xl border border-slate-200 dark:border-slate-800 break-words">
                                <div><strong>📍 Local / Estante:</strong> ${esc(c.shelf_location || 'Não informado')}</div>
                                <div><strong>👨‍🔧 Técnico:</strong> ${esc(c.tech_name || 'Fila')}</div>
                                <div><strong>🛡️ Lacre Colocado:</strong> <span class="text-sky-700 dark:text-sky-400 font-bold">${esc(c.inmetro_seal || 'Pendente')}</span></div>
                            </div>
                        </div>
                        ${photos.length ? `
                            <div class="mt-3 pt-2.5 border-t border-slate-100 dark:border-slate-800 flex gap-2 overflow-x-auto">
                                ${photos.map(url => `
                                    <img src="${esc(url)}" onclick="window.open('${esc(url)}')" class="w-16 h-16 object-cover rounded-xl border border-slate-200 dark:border-slate-700 cursor-pointer shrink-0">
                                `).join("")}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join("");
        }

        function applyConsultaTheme(theme) {
            const isDark = theme === "dark";
            document.documentElement.classList.toggle("dark", isDark);
            const btn = document.getElementById("consultaThemeBtn");
            if (btn) btn.textContent = isDark ? "☀️ Clean" : "🌙 Dark";
            localStorage.setItem("a5_consulta_theme", theme);
        }
        function toggleConsultaTheme() {
            const cur = localStorage.getItem("a5_consulta_theme") || "clean";
            applyConsultaTheme(cur === "dark" ? "clean" : "dark");
        }
        applyConsultaTheme(localStorage.getItem("a5_consulta_theme") || localStorage.getItem("a5_theme") || "clean");
    </script>
</body>
</html>
