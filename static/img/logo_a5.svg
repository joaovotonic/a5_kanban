  <text x="46" y="40" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#ffffff" text-anchor="middle" dominant-baseline="central">A5</text>

  <!-- Right Text: Tecnologia Balanças e Sistemas -->
